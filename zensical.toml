[project]
site_name = "UC4 Editor"
site_description = "User guide for the UC4 Editor, a browser editor for the Faderfox UC4."
docs_dir = "docs/guides"
site_url = "https://marvinhauke.github.io/UC4_Editor/guide/"
site_dir = "site"
copyright = "Unofficial: the UC4 Editor is not made by, endorsed by or supported by Faderfox."
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/zoom.js"]
nav = [
  { "Start" = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
  ] },
  { "Using the editor" = [
    { "The editor" = "editor.md" },
    { "From and to the UC4" = "device.md" },
    { "Files" = "files.md" },
    { "Copy / Paste, Reset, Library" = "copy-paste.md" },
  ] },
  { "Reference" = [
    { "Keys" = "keys.md" },
    { "How it works" = "how-it-works.md" },
  ] },
]

# Dark first, with a toggle.
[project.theme]
features = [
  "navigation.expand",
  "navigation.top",
  "search.suggest",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

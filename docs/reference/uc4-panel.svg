<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 820" width="560" height="820" font-family="system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Faderfox UC4 panel (schematic)</title>
<desc id="d">Own schematic of the UC4 front panel for the UC4 Editor: 8 encoders, display, 9 faders (fader 9 horizontal), Edit/Setup and Shift buttons, 8 green buttons with LEDs. Blue: encoder group controls; green: fader/button group controls.</desc>
<style>
  .panel{fill:#f6f6f4;stroke:#222;stroke-width:2}
  .area{fill:none;stroke:#222;stroke-width:1.5}
  .ctl{fill:#fff;stroke:#222;stroke-width:2}
  .enc{stroke:#2563eb}
  .fb{stroke:#15803d}
  .led{fill:#bbf7d0;stroke:#15803d;stroke-width:1.5}
  .led2{fill:#fde68a;stroke:#92400e;stroke-width:1.5}
  .track{stroke:#555;stroke-width:4;stroke-linecap:round}
  .disp{fill:#1a1a1a}
  .mark{stroke:#222;stroke-width:2}
  .seg{fill:#ef4444;font:700 28px ui-monospace,Menlo,monospace}
  .n{font-size:13px;font-weight:700;fill:#222;text-anchor:middle}
  .lb{font-size:10px;fill:#444;text-anchor:middle}
  .grp{fill:none;stroke-width:1.5;stroke-dasharray:6 4}
  .ge{stroke:#2563eb}.gf{stroke:#15803d}
  .leg{font-size:11px;fill:#222}
  @media (prefers-color-scheme: dark){
    .panel{fill:#1e1e1e;stroke:#ccc}.area{stroke:#ccc}.ctl{fill:#2a2a2a}
    .enc{stroke:#60a5fa}.fb{stroke:#4ade80}.n,.leg{fill:#eee}.lb{fill:#bbb}.track{stroke:#999}.mark{stroke:#ccc}
  }
</style>
<rect class="panel" x="2" y="2" width="556" height="816" rx="14"/>
<rect class="area" x="16" y="16" width="528" height="304" rx="10"/>
<rect class="area" x="16" y="324" width="528" height="450" rx="10"/>

<g id="enc1"><circle class="ctl enc" cx="80" cy="72" r="36"/><circle class="ctl enc" cx="80" cy="72" r="27"/><text class="n" x="80" y="77">1</text><text class="lb" x="80" y="124">Ctrl num</text><text class="lb" x="80" y="137" font-style="italic">Setup</text></g>
<g id="enc2"><circle class="ctl enc" cx="213" cy="72" r="36"/><circle class="ctl enc" cx="213" cy="72" r="27"/><text class="n" x="213" y="77">2</text><text class="lb" x="213" y="124">Disp scale</text><text class="lb" x="213" y="137" font-style="italic">Routing</text></g>
<g id="enc3"><circle class="ctl enc" cx="346" cy="72" r="36"/><circle class="ctl enc" cx="346" cy="72" r="27"/><text class="n" x="346" y="77">3</text><text class="lb" x="346" y="124">Cmd type</text><text class="lb" x="346" y="137" font-style="italic">Copy/Paste</text></g>
<g id="enc4"><circle class="ctl enc" cx="479" cy="72" r="36"/><circle class="ctl enc" cx="479" cy="72" r="27"/><text class="n" x="479" y="77">4</text><text class="lb" x="479" y="124">Cmd mode</text><text class="lb" x="479" y="137" font-style="italic">Sndc</text></g>
<g id="enc5"><circle class="ctl enc" cx="80" cy="246" r="36"/><circle class="ctl enc" cx="80" cy="246" r="27"/><text class="n" x="80" y="245">5</text><text class="lb" x="80" y="298">Cmd chan</text><text class="lb" x="80" y="311" font-style="italic">Reset cur.</text></g>
<g id="enc6"><circle class="ctl enc" cx="213" cy="246" r="36"/><circle class="ctl enc" cx="213" cy="246" r="27"/><text class="n" x="213" y="245">6</text><text class="lb" x="213" y="298">Cmd num</text><text class="lb" x="213" y="311" font-style="italic">Reset all</text></g>
<g id="enc7"><circle class="ctl enc" cx="346" cy="246" r="36"/><circle class="ctl enc" cx="346" cy="246" r="27"/><text class="n" x="346" y="245">7</text><text class="lb" x="346" y="298">Lower value</text><text class="lb" x="346" y="311" font-style="italic">Receive</text></g>
<g id="enc8"><circle class="ctl enc" cx="479" cy="246" r="36"/><circle class="ctl enc" cx="479" cy="246" r="27"/><text class="n" x="479" y="245">8</text><text class="lb" x="479" y="298">Upper value</text><text class="lb" x="479" y="311" font-style="italic">SndA</text></g>
<g id="display"><rect class="disp" x="200" y="142" width="160" height="46" rx="6"/><text class="seg" x="280" y="177" text-anchor="middle">GrP1</text><text class="lb" x="120" y="170">4-digit display</text><text class="lb" x="440" y="163">edit · setup jobs:</text><text class="lb" x="440" y="176">upright · italic</text></g>
<g id="fader1"><line class="track" x1="52" y1="346" x2="52" y2="520"/><rect class="ctl fb" x="39" y="416" width="26" height="36" rx="3"/><line x1="39" y1="434" x2="65" y2="434" class="mark"/><text class="n" x="52" y="545">1</text></g>
<g id="fader2"><line class="track" x1="117" y1="346" x2="117" y2="520"/><rect class="ctl fb" x="104" y="416" width="26" height="36" rx="3"/><line x1="104" y1="434" x2="130" y2="434" class="mark"/><text class="n" x="117" y="545">2</text></g>
<g id="fader3"><line class="track" x1="182" y1="346" x2="182" y2="520"/><rect class="ctl fb" x="169" y="416" width="26" height="36" rx="3"/><line x1="169" y1="434" x2="195" y2="434" class="mark"/><text class="n" x="182" y="545">3</text></g>
<g id="fader4"><line class="track" x1="247" y1="346" x2="247" y2="520"/><rect class="ctl fb" x="234" y="416" width="26" height="36" rx="3"/><line x1="234" y1="434" x2="260" y2="434" class="mark"/><text class="n" x="247" y="545">4</text></g>
<g id="fader5"><line class="track" x1="312" y1="346" x2="312" y2="520"/><rect class="ctl fb" x="299" y="416" width="26" height="36" rx="3"/><line x1="299" y1="434" x2="325" y2="434" class="mark"/><text class="n" x="312" y="545">5</text></g>
<g id="fader6"><line class="track" x1="377" y1="346" x2="377" y2="520"/><rect class="ctl fb" x="364" y="416" width="26" height="36" rx="3"/><line x1="364" y1="434" x2="390" y2="434" class="mark"/><text class="n" x="377" y="545">6</text></g>
<g id="fader7"><line class="track" x1="442" y1="346" x2="442" y2="520"/><rect class="ctl fb" x="429" y="416" width="26" height="36" rx="3"/><line x1="429" y1="434" x2="455" y2="434" class="mark"/><text class="n" x="442" y="545">7</text></g>
<g id="fader8"><line class="track" x1="507" y1="346" x2="507" y2="520"/><rect class="ctl fb" x="494" y="416" width="26" height="36" rx="3"/><line x1="494" y1="434" x2="520" y2="434" class="mark"/><text class="n" x="507" y="545">8</text></g>
<g id="fader9"><line class="track" x1="180" y1="620" x2="380" y2="620"/><rect class="ctl fb" x="266" y="598" width="28" height="44" rx="3"/><line x1="280" y1="598" x2="280" y2="642" class="mark"/><text class="n" x="402" y="625">9</text></g>
<g id="edit"><circle class="led2" cx="78" cy="572" r="6"/><circle class="led2" cx="104" cy="572" r="6"/><text class="lb" x="78" y="592">Edit</text><text class="lb" x="106" y="592">Setup</text><circle class="ctl" cx="91" cy="628" r="26"/></g>
<g id="shift"><text class="lb" x="470" y="592">Shift</text><circle class="ctl" cx="470" cy="628" r="26"/><text class="lb" x="470" y="668">hold + encoder/button</text><text class="lb" x="470" y="680">= select group</text></g>
<g id="btn1"><text class="n" x="43" y="706">1</text><circle class="led" cx="61" cy="701" r="6"/><circle class="ctl fb" cx="52" cy="740" r="24"/></g>
<g id="btn2"><text class="n" x="108" y="706">2</text><circle class="led" cx="126" cy="701" r="6"/><circle class="ctl fb" cx="117" cy="740" r="24"/></g>
<g id="btn3"><text class="n" x="173" y="706">3</text><circle class="led" cx="191" cy="701" r="6"/><circle class="ctl fb" cx="182" cy="740" r="24"/></g>
<g id="btn4"><text class="n" x="238" y="706">4</text><circle class="led" cx="256" cy="701" r="6"/><circle class="ctl fb" cx="247" cy="740" r="24"/></g>
<g id="btn5"><text class="n" x="303" y="706">5</text><circle class="led" cx="321" cy="701" r="6"/><circle class="ctl fb" cx="312" cy="740" r="24"/></g>
<g id="btn6"><text class="n" x="368" y="706">6</text><circle class="led" cx="386" cy="701" r="6"/><circle class="ctl fb" cx="377" cy="740" r="24"/></g>
<g id="btn7"><text class="n" x="433" y="706">7</text><circle class="led" cx="451" cy="701" r="6"/><circle class="ctl fb" cx="442" cy="740" r="24"/></g>
<g id="btn8"><text class="n" x="498" y="706">8</text><circle class="led" cx="516" cy="701" r="6"/><circle class="ctl fb" cx="507" cy="740" r="24"/></g>
<rect class="grp ge" x="22" y="22" width="516" height="292" rx="8"/>
<path class="grp gf" d="M24 334 H536 V562 H420 V650 H140 V562 H24 Z"/>
<rect class="grp gf" x="22" y="690" width="516" height="78" rx="8"/>
<text class="leg" x="20" y="800"><tspan fill="#2563eb">■</tspan> encoder group (shift + encoder)   <tspan fill="#15803d">■</tspan> fader/button group (shift + green button, LEDs show it)</text>
